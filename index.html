<!-- v68 · Estilo mínimo de la pantalla de carga EN LÍNEA: GitHub Pages deja los archivos
     ~10 min en la caché del navegador, y justo después de subir una versión puede llegar el
     index.html nuevo con el styles.css / 01-core.js viejos. Con esto la carga se ve bien y se
     va sola aunque pase eso (antes quedaba el logo gigante arriba de todo). -->
<style>
  .boot-splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--login-bg,#14100a);transition:opacity .25s ease}
  .boot-splash.is-out{opacity:0;pointer-events:none}
  .boot-logo{width:84px;height:84px;border-radius:20px;display:block}
</style>
<script>
  window.addEventListener("load",function(){ setTimeout(function(){
    var s=document.getElementById("bootSplash"); if(!s||s.dataset.out) return;
    s.dataset.out="1"; s.classList.add("is-out");
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },300);
  },1500); });
</script>
</head>

     vacía antes del login. La saca showLogin()/hideLogin() (js/01-core.js). -->
