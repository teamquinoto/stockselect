<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Select">
<title>Stock Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("gstock_theme");if(_t==="dark"||(!_t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}else if(_t==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login-scrim" hidden>
  <div class="login-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="login-card">
    <div class="login-logo-wrap"><img src="icon-512.png" alt="" class="login-logo" width="84" height="84"></div>
    <h1>Stock Select</h1>
    <p class="login-sub">Your inventory, synced across all your devices.</p>
    <div class="field"><label for="loginUser">Username</label>
      <input class="inp" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="your username"></div>
    <div class="field"><label for="loginPass">Password</label>
      <div class="pass-wrap">
        <input class="inp" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pass-toggle" id="loginPassToggle" aria-label="Show password" title="Show password" tabindex="-1">
          <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div id="loginErr" class="login-err"></div>
    <button class="btn primary login-btn" id="loginBtn">Sign in</button>
    <p class="login-build">build v58</p>
  </div>
</div>

<!-- Banner de entorno: red de seguridad anti-confusión (siempre visible) -->
<div class="envbar" id="envbar">
  <span class="dot" aria-hidden="true"></span>
  <span>SELECT · CROSS-BORDER</span>
  <span class="env-rt">USA&nbsp;·&nbsp;AR</span>
</div>

<!-- Barra superior: marca + estado + acciones -->
<header class="topbar" id="topbar">
  <div class="tb-brand">
    <img src="icon-192.png" class="tb-mark" alt="" width="28" height="28">
    <span class="tb-name">Stock Select</span>
  </div>
  <div class="tb-right">
    <span class="tb-ctx" data-rolebadge></span>
    <span class="tb-sync" data-syncchip>●</span>
    <button class="side-btn" data-syncside data-syncicon aria-label="Sync" title="Sync">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
      </svg>
    </button>
    <button class="theme-switch" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
      <span class="ts-track">
        <span class="ts-hint ts-hint-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="ts-hint ts-hint-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span class="ts-thumb"><span data-themeicon></span></span>
      </span>
    </button>
    <button class="side-btn is-logout" data-logout-side aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
      </svg>
    </button>
  </div>
</header>

<!-- Nivel 1: secciones tipo ERP -->
<nav class="navsections" id="navSections">
  <button data-section="op" class="on">Operations</button>
  <button data-section="cat">Catalog</button>
  <button data-section="fin" data-admin-only>Finance</button>
  <button data-section="dat" data-admin-only>Data</button>
</nav>

<!-- Nivel 2: vistas (el router se cablea a data-view; data-section agrupa) -->
<nav class="nav" id="nav">
  <button data-view="dash" data-section="op" class="on"><span class="ico">▤</span>Dashboard</button>
  <button data-view="ventas" data-section="op"><span class="ico">−</span>Sales</button>
  <button data-view="compras" data-section="op" data-admin-only><span class="ico">+</span>Purchases</button>
  <button data-view="conjunta" data-section="op" data-admin-only><span class="ico">⇄</span>Third-party</button>
  <button data-view="mov" data-section="op" data-admin-only><span class="ico">↕</span>Movements</button>
  <button data-view="prod" data-section="cat" class="hide-sec"><span class="ico">▦</span>Products</button>
  <button data-view="clientes" data-section="cat" class="hide-sec"><span class="ico">☺</span>Customers</button>
  <button data-view="analisis" data-section="fin" data-admin-only class="hide-sec"><span class="ico">◔</span>Analysis</button>
  <button data-view="inv" data-section="fin" data-admin-only class="hide-sec"><span class="ico">◈</span>Investments</button>
  <button data-view="datos" data-section="dat" data-admin-only class="hide-sec"><span class="ico">⤓</span>Data</button>
</nav>

<div class="mobtop" id="navMob">
  <img src="icon-192.png" alt="" class="brand-m-logo" width="24" height="24">
  <button data-view="dash" class="on">Dashboard</button>
  <button data-view="ventas">Sales</button>
  <button data-view="compras" data-admin-only>Purchases</button>
  <button data-view="conjunta" data-admin-only>Third-party</button>
  <button data-view="prod">Products</button>
  <button data-view="clientes">Cust.</button>
  <button data-view="mov" data-admin-only>Movem.</button>
  <button data-view="analisis" data-admin-only>Analysis</button>
  <button data-view="inv" data-admin-only>Investments</button>
  <button data-view="datos" data-admin-only>Data</button>
  <span class="mob-role" data-rolebadge style="align-self:center;margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap;padding:3px 8px;border-radius:999px;text-transform:uppercase"></span>
</div>

<main class="main" id="main"></main>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="js/15-view-movimientos.js"></script>
<script src="js/16-view-datos.js"></script>
<script src="js/20-modal-producto.js"></script>
<script src="js/21-modal-documento.js"></script>

<script src="js/30-pdf.js"></script>

<script src="js/90-boot.js"></script>
</body>
</html>
